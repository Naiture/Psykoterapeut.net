<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#744245" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Calendar -->
  <rect x="45" y="55" width="110" height="100" rx="8" fill="#F4EBE4"/>
  <rect x="45" y="55" width="110" height="100" rx="8"/>
  <!-- Calendar header -->
  <line x1="45" y1="80" x2="155" y2="80"/>
  <!-- Calendar hooks -->
  <line x1="75" y1="48" x2="75" y2="62"/>
  <line x1="125" y1="48" x2="125" y2="62"/>
  <!-- Calendar grid dots (days) -->
  <circle cx="70" cy="95" r="3" fill="#744245" opacity="0.2" stroke="none"/>
  <circle cx="90" cy="95" r="3" fill="#744245" opacity="0.2" stroke="none"/>
  <circle cx="110" cy="95" r="3" fill="#744245" opacity="0.2" stroke="none"/>
  <circle cx="130" cy="95" r="3" fill="#744245" opacity="0.2" stroke="none"/>
  <circle cx="70" cy="115" r="3" fill="#744245" opacity="0.2" stroke="none"/>
  <circle cx="90" cy="115" r="3" fill="#744245" opacity="0.2" stroke="none"/>
  <!-- Highlighted day -->
  <circle cx="110" cy="115" r="8" fill="#744245" opacity="0.15" stroke="none"/>
  <circle cx="110" cy="115" r="3" fill="#744245" stroke="none"/>
  <circle cx="130" cy="115" r="3" fill="#744245" opacity="0.2" stroke="none"/>
  <circle cx="70" cy="135" r="3" fill="#744245" opacity="0.2" stroke="none"/>
  <circle cx="90" cy="135" r="3" fill="#744245" opacity="0.2" stroke="none"/>
  <!-- Clock overlay -->
  <circle cx="150" cy="145" r="22" fill="#F4EBE4"/>
  <circle cx="150" cy="145" r="22"/>
  <line x1="150" y1="145" x2="150" y2="132"/>
  <line x1="150" y1="145" x2="160" y2="145"/>
  <circle cx="150" cy="145" r="2" fill="#744245" stroke="none"/>
</svg>
