<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="#2a1f3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cozy house / therapy room illustration -->
  <!-- House shape -->
  <path d="M20 55 L60 25 L100 55" stroke="#2a1f3b" stroke-width="2" fill="none"/>
  <rect x="28" y="55" width="64" height="38" rx="2" fill="#f5f0eb" stroke="#2a1f3b"/>
  <!-- Door -->
  <rect x="50" y="65" width="20" height="28" rx="10" fill="#744245" stroke="#2a1f3b"/>
  <circle cx="65" cy="80" r="2" fill="#f5f0eb" stroke="none"/>
  <!-- Window left -->
  <rect x="33" y="62" width="14" height="12" rx="2" fill="#fff" stroke="#2a1f3b"/>
  <line x1="40" y1="62" x2="40" y2="74" stroke="#2a1f3b" opacity="0.3"/>
  <line x1="33" y1="68" x2="47" y2="68" stroke="#2a1f3b" opacity="0.3"/>
  <!-- Window right -->
  <rect x="73" y="62" width="14" height="12" rx="2" fill="#fff" stroke="#2a1f3b"/>
  <line x1="80" y1="62" x2="80" y2="74" stroke="#2a1f3b" opacity="0.3"/>
  <line x1="73" y1="68" x2="87" y2="68" stroke="#2a1f3b" opacity="0.3"/>
  <!-- Chimney -->
  <rect x="78" y="32" width="10" height="18" rx="1" fill="#f5f0eb" stroke="#2a1f3b"/>
  <!-- Smoke -->
  <path d="M83 30 Q80 22 85 18 Q82 12 86 8" stroke="#2a1f3b" stroke-width="1" opacity="0.3" fill="none"/>
  <!-- Plant/tree -->
  <g transform="translate(15, 70)">
    <line x1="0" y1="23" x2="0" y2="12" stroke="#744245" stroke-width="2"/>
    <circle cx="-4" cy="10" r="5" fill="#744245" opacity="0.2" stroke="none"/>
    <circle cx="4" cy="7" r="6" fill="#744245" opacity="0.25" stroke="none"/>
    <circle cx="0" cy="4" r="5" fill="#744245" opacity="0.3" stroke="none"/>
  </g>
  <!-- Path to door -->
  <path d="M60 93 Q55 100 50 105 Q55 108 60 105 Q65 108 70 105 Q65 100 60 93" fill="#744245" opacity="0.15" stroke="none"/>
  <!-- Decorative stars -->
  <circle cx="105" cy="40" r="1.5" fill="#2a1f3b"/>
  <circle cx="25" cy="30" r="1" fill="#2a1f3b"/>
  <circle cx="100" cy="85" r="1" fill="#2a1f3b"/>
</svg>