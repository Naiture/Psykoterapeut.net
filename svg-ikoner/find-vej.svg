<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="#2a1f3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Map/location illustration -->
  <!-- Folded map -->
  <path d="M20 85 L40 80 L60 85 L80 80 L100 85 L100 35 L80 40 L60 35 L40 40 L20 35 Z" fill="#f5f0eb" stroke="#2a1f3b"/>
  <line x1="40" y1="40" x2="40" y2="80" opacity="0.4"/>
  <line x1="60" y1="35" x2="60" y2="85" opacity="0.4"/>
  <line x1="80" y1="40" x2="80" y2="80" opacity="0.4"/>
  <!-- Dotted path on map -->
  <path d="M30 65 Q45 50 55 58 Q65 66 75 52 L88 45" stroke="#744245" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <!-- Location pin -->
  <g transform="translate(60, 15)">
    <path d="M0 0 C-8 0 -14 6 -14 14 C-14 24 0 35 0 35 C0 35 14 24 14 14 C14 6 8 0 0 0Z" fill="#744245" stroke="#2a1f3b" stroke-width="1.5"/>
