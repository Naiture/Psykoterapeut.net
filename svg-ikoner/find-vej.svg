  </g>
  <!-- Small decorative stars -->
  <circle cx="25" cy="28" r="1.5" fill="#2a1f3b"/>
  <circle cx="95" cy="25" r="1" fill="#2a1f3b"/>
  <circle cx="15" cy="50" r="1" fill="#2a1f3b"/>
</svg>